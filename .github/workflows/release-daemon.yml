name: Release daemon

on:
  push:
    tags:
      - "custosd/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build + package
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME#custosd/} # custosd/v1.2.3 -> v1.2.3

          # daemon is linux-only: it wires systemd + sshd AuthorizedKeysCommand.
          for GOARCH in amd64 arm64; do
            OUT="dist/custosd"
            GOOS=linux GOARCH=$GOARCH \
              go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "$OUT" ./cmd/daemon
            tar -czf "dist/custosd_${VERSION}_linux_${GOARCH}.tar.gz" -C dist custosd
            rm "$OUT"
          done

          ( cd dist && sha256sum *.tar.gz > custosd_${VERSION}_checksums.txt )

      - name: Create release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
